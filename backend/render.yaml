# For the existing service, apply the matching settings in Render's dashboard.
# If using a Blueprint, select backend/render.yaml as its Blueprint Path.
services:
  - type: web
    name: gyproject
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: gyproject.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://gy-project-frontend.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
