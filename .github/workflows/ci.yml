name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: sqlite
            database_url: "sqlite:///:memory:"
          - database: postgresql
            database_url: "postgresql://gytest:gytest@localhost:5432/gytest"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gytest
          POSTGRES_PASSWORD: gytest
          POSTGRES_DB: gytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ matrix.database_url }}
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "ci-test-only-secret"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test core.tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build
